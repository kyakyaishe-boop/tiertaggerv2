name: Build TierTagger 26.2

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"
          cache-provider: basic

      - name: Verify Gradle version
        run: gradle --version

      - name: Build mod
        run: gradle clean build --no-daemon --stacktrace

      - name: Show built jars
        run: ls -lah build/libs/

      - name: Upload Minecraft jar
        uses: actions/upload-artifact@v4
        with:
          name: TierTagger-26.2
          path: build/libs/tiertagger-*.jar
          if-no-files-found: error
